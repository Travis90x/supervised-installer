```yaml
# =====================================================================
#  INVERTER PROTOCOL SCANNER / IDENTIFIER
#  ESPHome - Heltec WiFi Kit 32 V3
#
#  Purpose:
#    - Scan supported inverter protocol families
#    - Scan baud rates
#    - Distinguish a real protocol match from random ASCII data
#    - Test multiple commands for every family
#    - Print all detected families at the end
#    - Try to identify the inverter model when the protocol exposes it
#
#  IMPORTANT:
#    A valid QPIGS response does NOT by itself prove the exact inverter
#    model. The scanner therefore reports:
#
#      PROTOCOL MATCH
#      MODEL IDENTIFICATION
#
#    separately.
#
#  Wiring:
#
#    ESP32 GPIO3 (TX) -> MAX3232 TTL RX
#    ESP32 GPIO5 (RX) <- MAX3232 TTL TX
#
#    MAX3232 RS232 side:
#      RJ45 pin 1 = inverter TX
#      RJ45 pin 2 = inverter RX
#      RJ45 pin 8 = GND
#      RJ45 pin 4 = +12V -> DO NOT CONNECT
#
# =====================================================================


esphome:
  name: "heltec-test"
  friendly_name: Heltec Inverter Scanner


esp32:
  board: heltec_wifi_kit_32_V3
  variant: esp32s3

  framework:
    type: arduino


# =====================================================================
# LOGGER
# =====================================================================

logger:
  level: DEBUG
  baud_rate: 0


# =====================================================================
# HOME ASSISTANT API
# =====================================================================

api:
  encryption:
    key: !secret api_key_heltec_v3

  reboot_timeout: 0s


# =====================================================================
# OTA
# =====================================================================

ota:
  - platform: esphome


# =====================================================================
# WIFI
# =====================================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  manual_ip:
    static_ip: 192.168.1.125
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 192.168.1.1

  power_save_mode: none

  ap:
    ssid: "Heltec-V3"
    password: !secret wifi_hotspot_password


captive_portal:


# =====================================================================
# UART
# =====================================================================

uart:

  id: uart_0

  # ESP32 TX -> MAX3232 TTL RX
  tx_pin: GPIO3

  # MAX3232 TTL TX -> ESP32 RX
  rx_pin: GPIO5

  baud_rate: 2400

  data_bits: 8
  parity: NONE
  stop_bits: 1

  debug:
    direction: RX

    dummy_receiver: false

    after:
      delimiter: "\r"
      timeout: 250ms

    sequence:

      - lambda: |-

          /*
           * Do not print every byte here.
           *
           * The scanner reads and validates the response itself.
           */


# =====================================================================
# GLOBAL VARIABLES
# =====================================================================

globals:

  # ---------------------------------------------------------------
  # Current baud rate
  # ---------------------------------------------------------------

  - id: current_baud
    type: int
    restore_value: no
    initial_value: "2400"


  # ---------------------------------------------------------------
  # Number of bytes received
  # ---------------------------------------------------------------

  - id: rx_count
    type: int
    restore_value: no
    initial_value: "0"


  # ---------------------------------------------------------------
  # Current family result flags
  # ---------------------------------------------------------------

  - id: pi30_found
    type: bool
    restore_value: no
    initial_value: "false"

  - id: phocos_found
    type: bool
    restore_value: no
    initial_value: "false"

  - id: pi41_found
    type: bool
    restore_value: no
    initial_value: "false"

  - id: pi18_found
    type: bool
    restore_value: no
    initial_value: "false"

  - id: pi17_found
    type: bool
    restore_value: no
    initial_value: "false"

  - id: pi16_found
    type: bool
    restore_value: no
    initial_value: "false"

  - id: qx_found
    type: bool
    restore_value: no
    initial_value: "false"

  - id: modbus_found
    type: bool
    restore_value: no
    initial_value: "false"


  # ---------------------------------------------------------------
  # Number of successful commands for PI30
  # ---------------------------------------------------------------

  - id: pi30_score
    type: int
    restore_value: no
    initial_value: "0"


  # ---------------------------------------------------------------
  # Number of successful commands for other families
  # ---------------------------------------------------------------

  - id: phocos_score
    type: int
    restore_value: no
    initial_value: "0"

  - id: pi41_score
    type: int
    restore_value: no
    initial_value: "0"

  - id: pi18_score
    type: int
    restore_value: no
    initial_value: "0"

  - id: pi17_score
    type: int
    restore_value: no
    initial_value: "0"

  - id: pi16_score
    type: int
    restore_value: no
    initial_value: "0"

  - id: qx_score
    type: int
    restore_value: no
    initial_value: "0"

  - id: modbus_score
    type: int
    restore_value: no
    initial_value: "0"


  # ---------------------------------------------------------------
  # Model identification
  # ---------------------------------------------------------------

  - id: model_identified
    type: bool
    restore_value: no
    initial_value: "false"


  # ---------------------------------------------------------------
  # Best baud rate for PI30
  # ---------------------------------------------------------------

  - id: pi30_baud
    type: int
    restore_value: no
    initial_value: "0"


# =====================================================================
# HELPER SCRIPT
#
# Sends one command and waits for the response.
#
# The actual validation is done inside the individual family tests.
# =====================================================================

script:

  # ===================================================================
  # CLEAR RX BUFFER
  # ===================================================================

  - id: clear_rx
    mode: single

    then:

      - lambda: |-

          uint8_t c;

          while (id(uart_0).available()) {
            id(uart_0).read_byte(&c);
          }

          id(rx_count) = 0;


  # ===================================================================
  # PI30 FAMILY TEST
  #
  # Main commands:
  #
  #   QPI
  #   QPIGS
  #   QPIRI
  #   QPIWS
  #   QMOD
  #   QFLAG
  #   QMN
  #
  # ===================================================================

  - id: test_pi30
    mode: single

    then:

      - lambda: |-

          id(pi30_score) = 0;


      # ---------------------------------------------------------------
      # QPIGS
      # ---------------------------------------------------------------

      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x50, 0x49, 0x47,
              0x53, 0xB7, 0xA9, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c)) {
              d.push_back(c);
            }
          }

          id(rx_count) = d.size();

          bool valid = false;

          /*
           * QPIGS responses normally start with '('.
           *
           * The response must also contain several printable
           * ASCII characters and spaces.
           */

          if (d.size() >= 50 && d[0] == '(') {

            int printable = 0;
            int spaces = 0;

            for (auto b : d) {

              if (b >= 0x20 && b <= 0x7E)
                printable++;

              if (b == 0x20)
                spaces++;
            }

            float ratio =
              (float)printable / (float)d.size();

            if (ratio > 0.75 && spaces >= 5)
              valid = true;
          }


          if (valid) {

            id(pi30_score)++;

            ESP_LOGI(
              "PI30",
              "QPIGS = PASS"
            );

          } else {

            ESP_LOGI(
              "PI30",
              "QPIGS = FAIL"
            );
          }


      # ---------------------------------------------------------------
      # QPIRI
      # ---------------------------------------------------------------

      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x50, 0x49, 0x52,
              0x49, 0xF8, 0x54, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          bool valid = false;

          if (d.size() >= 30 && d[0] == '(') {

            int printable = 0;

            for (auto b : d) {

              if (b >= 0x20 && b <= 0x7E)
                printable++;
            }

            if (
              ((float)printable / d.size()) > 0.75
            )
              valid = true;
          }

          if (valid) {

            id(pi30_score)++;

            ESP_LOGI(
              "PI30",
              "QPIRI = PASS"
            );

          } else {

            ESP_LOGI(
              "PI30",
              "QPIRI = FAIL"
            );
          }


      # ---------------------------------------------------------------
      # QPIWS
      # ---------------------------------------------------------------

      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x50, 0x49, 0x57,
              0x53, 0xB4, 0xDA, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          bool valid = false;

          if (d.size() >= 10 && d[0] == '(') {

            int printable = 0;

            for (auto b : d) {

              if (b >= 0x20 && b <= 0x7E)
                printable++;
            }

            if (
              ((float)printable / d.size()) > 0.75
            )
              valid = true;
          }

          if (valid) {

            id(pi30_score)++;

            ESP_LOGI(
              "PI30",
              "QPIWS = PASS"
            );

          } else {

            ESP_LOGI(
              "PI30",
              "QPIWS = FAIL"
            );
          }


      # ---------------------------------------------------------------
      # QMOD
      # ---------------------------------------------------------------

      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x4D, 0x4F,
              0x44, 0x49, 0xC1,
              0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          bool valid = false;

          /*
           * QMOD normally returns a short ASCII response
           * containing a mode character.
           */

          if (d.size() >= 3) {

            int printable = 0;

            for (auto b : d) {

              if (b >= 0x20 && b <= 0x7E)
                printable++;
            }

            if (
              ((float)printable / d.size()) > 0.70
            )
              valid = true;
          }

          if (valid) {

            id(pi30_score)++;

            ESP_LOGI(
              "PI30",
              "QMOD = PASS"
            );

          } else {

            ESP_LOGI(
              "PI30",
              "QMOD = FAIL"
            );
          }


      # ---------------------------------------------------------------
      # QMN - MODEL / MANUFACTURER INFORMATION
      # ---------------------------------------------------------------

      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x4D, 0x4E,
              0xBB, 0x64, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }


          if (d.size() > 0) {

            std::string s;

            for (auto b : d) {

              if (
                (b >= 0x20 && b <= 0x7E)
                || b == '\r'
              ) {
                s += (char)b;
              }
            }

            ESP_LOGI(
              "PI30",
              "QMN response: %s",
              s.c_str()
            );


            /*
             * Do NOT automatically claim PMSUN here.
             *
             * We only mark model identification if the returned
             * string actually contains an explicit model identifier.
             */

            std::string upper = s;

            for (auto &ch : upper)
              ch = ::toupper((unsigned char)ch);


            if (
              upper.find("PMSUN") != std::string::npos ||
              upper.find("SM-3200H") != std::string::npos ||
              upper.find("3200H") != std::string::npos
            ) {

              id(model_identified) = true;

              ESP_LOGI(
                "MODEL",
                "Explicit model identification detected!"
              );

            } else {

              ESP_LOGI(
                "MODEL",
                "QMN responded, but exact model was not identified."
              );
            }

          }


      # ---------------------------------------------------------------
      # FINAL PI30 DECISION
      #
      # Require at least 3 successful commands.
      # ---------------------------------------------------------------

      - lambda: |-

          if (id(pi30_score) >= 3) {

            id(pi30_found) = true;

            id(pi30_baud) = id(current_baud);

            ESP_LOGI(
              "PI30",
              "PI30 PROTOCOL MATCH"
            );

            ESP_LOGI(
              "PI30",
              "Score = %d / 5",
              id(pi30_score)
            );

          } else {

            ESP_LOGI(
              "PI30",
              "PI30 protocol match FAILED"
            );
          }


  # ===================================================================
  # PHOCOS ANY-GRID
  # ===================================================================

  - id: test_phocos
    mode: single

    then:

      - lambda: |-
          id(phocos_score) = 0;


      # QPGS0

      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x50, 0x47,
              0x53, 0x30, 0x3F,
              0xDA, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 20 && d[0] == '(') {

            id(phocos_score)++;

            ESP_LOGI(
              "PHOCOS",
              "QPGS0 = PASS"
            );

          } else {

            ESP_LOGI(
              "PHOCOS",
              "QPGS0 = FAIL"
            );
          }


      # QPGS1

      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x50, 0x47,
              0x53, 0x31, 0x2F,
              0xFB, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 10) {

            id(phocos_score)++;

            ESP_LOGI(
              "PHOCOS",
              "QPGS1 = PASS"
            );

          } else {

            ESP_LOGI(
              "PHOCOS",
              "QPGS1 = FAIL"
            );
          }


      # QPGS2

      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x50, 0x47,
              0x53, 0x32, 0x1F,
              0x98, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 10) {

            id(phocos_score)++;

            ESP_LOGI(
              "PHOCOS",
              "QPGS2 = PASS"
            );

          } else {

            ESP_LOGI(
              "PHOCOS",
              "QPGS2 = FAIL"
            );
          }


      - lambda: |-

          if (id(phocos_score) >= 2) {

            id(phocos_found) = true;

            ESP_LOGI(
              "PHOCOS",
              "PHOCOS Any-Grid PROTOCOL MATCH"
            );

          }


  # ===================================================================
  # PI41
  # ===================================================================

  - id: test_pi41
    mode: single

    then:

      - lambda: |-
          id(pi41_score) = 0;


      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x50, 0x49,
              0x47, 0x53, 0x32,
              0x68, 0x2D, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 20) {

            id(pi41_score)++;

            ESP_LOGI(
              "PI41",
              "QPIGS2 = PASS"
            );

          } else {

            ESP_LOGI(
              "PI41",
              "QPIGS2 = FAIL"
            );
          }


      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x50, 0x32,
              0x47, 0x53, 0x30,
              0x14, 0x05, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 10) {

            id(pi41_score)++;

            ESP_LOGI(
              "PI41",
              "QP2GS0 = PASS"
            );

          } else {

            ESP_LOGI(
              "PI41",
              "QP2GS0 = FAIL"
            );
          }


      - lambda: |-

          if (id(pi41_score) >= 2) {

            id(pi41_found) = true;

            ESP_LOGI(
              "PI41",
              "PI41 PROTOCOL MATCH"
            );
          }


  # ===================================================================
  # PI18
  # ===================================================================

  - id: test_pi18
    mode: single

    then:

      - lambda: |-

          id(pi18_score) = 0;


      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x5E, 0x50, 0x30, 0x30,
              0x35, 0x50, 0x49,
              0x71, 0x8B, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 10) {

            id(pi18_score)++;

            ESP_LOGI(
              "PI18",
              "^P005PI = PASS"
            );

          } else {

            ESP_LOGI(
              "PI18",
              "^P005PI = FAIL"
            );
          }


      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x5E, 0x50, 0x30, 0x30,
              0x35, 0x47, 0x53,
              0x58, 0x14, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 10)
            id(pi18_score)++;


      - lambda: |-

          if (id(pi18_score) >= 2) {

            id(pi18_found) = true;

            ESP_LOGI(
              "PI18",
              "PI18 PROTOCOL MATCH"
            );
          }


  # ===================================================================
  # PI17
  # ===================================================================

  - id: test_pi17
    mode: single

    then:

      - lambda: |-

          id(pi17_score) = 0;


      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x5E, 0x50, 0x30,
              0x30, 0x33, 0x50,
              0x49, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 5)
            id(pi17_score)++;


      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x5E, 0x50, 0x30,
              0x30, 0x34, 0x4D,
              0x4F, 0x44, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 5)
            id(pi17_score)++;


      - lambda: |-

          if (id(pi17_score) >= 2) {

            id(pi17_found) = true;

            ESP_LOGI(
              "PI17",
              "PI17 PROTOCOL MATCH"
            );
          }


  # ===================================================================
  # PI16
  # ===================================================================

  - id: test_pi16
    mode: single

    then:

      - lambda: |-

          id(pi16_score) = 0;


      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x50,
              0x49, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 3)
            id(pi16_score)++;


      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x4D,
              0x4F, 0x44,
              0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 3)
            id(pi16_score)++;


      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x50,
              0x49, 0x47,
              0x53, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 10)
            id(pi16_score)++;


      - lambda: |-

          if (id(pi16_score) >= 2) {

            id(pi16_found) = true;

            ESP_LOGI(
              "PI16",
              "PI16 PROTOCOL MATCH"
            );
          }


  # ===================================================================
  # Qx
  # ===================================================================

  - id: test_qx
    mode: single

    then:

      - lambda: |-
          id(qx_score) = 0;


      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x31, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 3)
            id(qx_score)++;


      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x51, 0x32, 0x0D
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (d.size() >= 3)
            id(qx_score)++;


      - lambda: |-

          if (id(qx_score) >= 2) {

            id(qx_found) = true;

            ESP_LOGI(
              "QX",
              "Qx PROTOCOL MATCH"
            );
          }


  # ===================================================================
  # MODBUS RTU
  # ===================================================================

  - id: test_modbus
    mode: single

    then:

      - lambda: |-
          id(modbus_score) = 0;


      # ---------------------------------------------------------------
      # Slave 05 / register 4506
      # ---------------------------------------------------------------

      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x05, 0x03,
              0x11, 0x9A,
              0x00, 0x02,
              0xE0, 0x9C
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          /*
           * Expected Modbus response:
           *
           * slave
           * function
           * byte count
           * data...
           *
           * At least 7 bytes for two registers.
           */

          if (
            d.size() >= 7 &&
            d[0] == 0x05 &&
            d[1] == 0x03
          ) {

            id(modbus_score)++;

            ESP_LOGI(
              "MODBUS",
              "Slave 05 = PASS"
            );

          } else {

            ESP_LOGI(
              "MODBUS",
              "Slave 05 = FAIL"
            );
          }


      # ---------------------------------------------------------------
      # Slave 01 / register 201
      # ---------------------------------------------------------------

      - script.execute: clear_rx

      - uart.write:
          data:
            [
              0x01, 0x03,
              0x00, 0xC9,
              0x00, 0x01,
              0x54, 0x34
            ]

      - delay: 500ms

      - lambda: |-

          std::vector<uint8_t> d;

          uint8_t c;

          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }

          if (
            d.size() >= 5 &&
            d[0] == 0x01 &&
            d[1] == 0x03
          ) {

            id(modbus_score)++;

            ESP_LOGI(
              "MODBUS",
              "Slave 01 = PASS"
            );

          } else {

            ESP_LOGI(
              "MODBUS",
              "Slave 01 = FAIL"
            );
          }


      - lambda: |-

          if (id(modbus_score) >= 1) {

            id(modbus_found) = true;

            ESP_LOGI(
              "MODBUS",
              "MODBUS PROTOCOL MATCH"
            );
          }


