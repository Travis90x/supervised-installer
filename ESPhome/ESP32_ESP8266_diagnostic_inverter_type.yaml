```yaml
# =====================================================================
# INVERTER UART DIAGNOSTIC TEST
# Heltec WiFi Kit 32 V3
#
# UART:
#   ESP32 GPIO3 (TX) -> MAX3232 TTL RX
#   ESP32 GPIO5 (RX) <- MAX3232 TTL TX
#
# RS232 side:
#   RJ45 pin 1 -> MAX3232 RS232 input/output according to module marking
#   RJ45 pin 2 -> MAX3232 RS232 input/output according to module marking
#   RJ45 pin 8 -> GND
#   RJ45 pin 4 -> DO NOT CONNECT
#
# Protocol tested:
#   QPI
#   QID
#   QVFW
#   QPIRI
#   QDI
#   QFLAG
#   QMOD
#   QPIGS
#   QPIWS
#
# Baud rate:
#   2400 8N1
#
# The test runs continuously every 30 seconds.
# =====================================================================


esphome:
  name: "heltec-inverter"
  friendly_name: "Heltec Inverter"


# =====================================================================
# ESP32
# =====================================================================

esp32:
  board: heltec_wifi_kit_32_V3
  variant: esp32s3

  framework:
    type: arduino


# =====================================================================
# LOGGER
# =====================================================================

logger:
  level: DEBUG
  baud_rate: 0


# =====================================================================
# HOME ASSISTANT API
# =====================================================================

api:
  encryption:
    key: !secret api_key_heltec_v3

  reboot_timeout: 0s


# =====================================================================
# OTA
# =====================================================================

ota:
  - platform: esphome


# =====================================================================
# WIFI
# =====================================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  manual_ip:
    static_ip: 192.168.1.125
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 192.168.1.1

  power_save_mode: none

  ap:
    ssid: "Heltec-Inverter"
    password: !secret wifi_hotspot_password


captive_portal:


# =====================================================================
# UART
# =====================================================================

uart:

  id: inverter_uart

  # ESP32 TX -> MAX3232 TTL RX
  tx_pin: GPIO3

  # MAX3232 TTL TX -> ESP32 RX
  rx_pin: GPIO5

  baud_rate: 2400

  data_bits: 8
  parity: NONE
  stop_bits: 1

  debug:

    direction: RX

    dummy_receiver: false

    after:
      delimiter: "\r"
      timeout: 500ms

    sequence:

      - lambda: |-

          if (bytes.empty()) {
            return;
          }

          ESP_LOGI(
            "UART_RX",
            "Received %d bytes",
            (int) bytes.size()
          );

          // -----------------------------------------------------------
          // ASCII representation
          // -----------------------------------------------------------

          std::string ascii;

          for (uint8_t c : bytes) {

            if (c >= 0x20 && c <= 0x7E) {
              ascii += static_cast<char>(c);
            }

            else if (c == '\r') {
              ascii += "\\r";
            }

            else if (c == '\n') {
              ascii += "\\n";
            }

            else {
              ascii += ".";
            }
          }

          ESP_LOGI(
            "UART_RX",
            "ASCII: %s",
            ascii.c_str()
          );


          // -----------------------------------------------------------
          // HEX representation
          // -----------------------------------------------------------

          std::string hex;

          char buffer[4];

          for (size_t i = 0; i < bytes.size(); i++) {

            snprintf(
              buffer,
              sizeof(buffer),
              "%02X",
              bytes[i]
            );

            hex += buffer;

            if (i + 1 < bytes.size()) {
              hex += " ";
            }
          }

          ESP_LOGI(
            "UART_RX",
            "HEX: %s",
            hex.c_str()
          );


# =====================================================================
# INVERTER COMMAND TEST
# =====================================================================

script:

  - id: test_inverter_commands

    mode: single

    then:

      # ---------------------------------------------------------------
      # Clear RX buffer
      # ---------------------------------------------------------------

      - lambda: |-

          while (id(inverter_uart).available()) {

            uint8_t c;

            id(inverter_uart).read_byte(&c);
          }


      - logger.log:
          level: INFO
          format: "============================================"

      - logger.log:
          level: INFO
          format: "INVERTER UART DIAGNOSTIC TEST"

      - logger.log:
          level: INFO
          format: "BAUD RATE: 2400"

      - logger.log:
          level: INFO
          format: "TX GPIO: GPIO3"

      - logger.log:
          level: INFO
          format: "RX GPIO: GPIO5"

      - logger.log:
          level: INFO
          format: "============================================"


      # ===============================================================
      # QPI
      # ===============================================================

      - logger.log:
          level: INFO
          format: "[1/9] Sending QPI"

      - uart.write:
          data:
            - 0x51
            - 0x50
            - 0x49
            - 0xBE
            - 0xAC
            - 0x0D

      - delay: 1500ms


      # ===============================================================
      # QID
      # ===============================================================

      - logger.log:
          level: INFO
          format: "[2/9] Sending QID"

      - uart.write:
          data:
            - 0x51
            - 0x49
            - 0x44
            - 0xD5
            - 0xEA
            - 0x0D

      - delay: 1500ms


      # ===============================================================
      # QVFW
      # ===============================================================

      - logger.log:
          level: INFO
          format: "[3/9] Sending QVFW"

      - uart.write:
          data:
            - 0x51
            - 0x56
            - 0x46
            - 0x57
            - 0x25
            - 0xA5
            - 0x0D

      - delay: 1500ms


      # ===============================================================
      # QPIRI
      # ===============================================================

      - logger.log:
          level: INFO
          format: "[4/9] Sending QPIRI"

      - uart.write:
          data:
            - 0x51
            - 0x50
            - 0x49
            - 0x52
            - 0x49
            - 0xF8
            - 0x54
            - 0x0D

      - delay: 1500ms


      # ===============================================================
      # QDI
      # ===============================================================

      - logger.log:
          level: INFO
          format: "[5/9] Sending QDI"

      - uart.write:
          data:
            - 0x51
            - 0x44
            - 0x49
            - 0x71
            - 0x1B
            - 0x0D

      - delay: 1500ms


      # ===============================================================
      # QFLAG
      # ===============================================================

      - logger.log:
          level: INFO
          format: "[6/9] Sending QFLAG"

      - uart.write:
          data:
            - 0x51
            - 0x46
            - 0x4C
            - 0x41
            - 0x47
            - 0x98
            - 0x74
            - 0x0D

      - delay: 1500ms


      # ===============================================================
      # QMOD
      # ===============================================================

      - logger.log:
          level: INFO
          format: "[7/9] Sending QMOD"

      - uart.write:
          data:
            - 0x51
            - 0x4D
            - 0x4F
            - 0x44
            - 0x49
            - 0xC1
            - 0x0D

      - delay: 1500ms


      # ===============================================================
      # QPIGS
      # ===============================================================

      - logger.log:
          level: INFO
          format: "[8/9] Sending QPIGS"

      - uart.write:
          data:
            - 0x51
            - 0x50
            - 0x49
            - 0x47
            - 0x53
            - 0xB7
            - 0xA9
            - 0x0D

      - delay: 1500ms


      # ===============================================================
      # QPIWS
      # ===============================================================

      - logger.log:
          level: INFO
          format: "[9/9] Sending QPIWS"

      - uart.write:
          data:
            - 0x51
            - 0x50
            - 0x49
            - 0x57
            - 0x53
            - 0xB4
            - 0xDA
            - 0x0D

      - delay: 1500ms


      # ===============================================================
      # TEST COMPLETE
      # ===============================================================

      - logger.log:
          level: INFO
          format: "============================================"

      - logger.log:
          level: INFO
          format: "DIAGNOSTIC TEST COMPLETE"

      - logger.log:
          level: INFO
          format: "============================================"


# =====================================================================
# AUTOMATIC TEST
# =====================================================================

interval:

  - interval: 30s

    then:

      - script.execute: test_inverter_commands
```
