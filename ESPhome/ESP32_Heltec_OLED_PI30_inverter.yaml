# =====================================================================
# SWITCH
# =====================================================================

switch:

  - platform: template

    name: "PI30 automatic polling"

    restore_mode: ALWAYS_ON

    turn_on_action:

      - lambda: |-
          id(g_polling) = true;


    turn_off_action:

      - lambda: |-
          id(g_polling) = false;


# =====================================================================
# BUTTONS
# =====================================================================

button:

  # -------------------------------------------------------------------
  # Manual command
  # -------------------------------------------------------------------

  - platform: template

    name: "PI30 send manual command"

    on_press:

      - script.execute:
          id: send_cmd
          cmd: !lambda "return id(txt_cmd).state;"


  # -------------------------------------------------------------------
  # READ COMMANDS
  # -------------------------------------------------------------------

  - platform: template
    name: "PI30 QPI"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "QPI"


  - platform: template
    name: "PI30 QID"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "QID"


  - platform: template
    name: "PI30 QVFW"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "QVFW"


  - platform: template
    name: "PI30 QMN"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "QMN"


  - platform: template
    name: "PI30 QPIRI"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "QPIRI"


  - platform: template
    name: "PI30 QDI"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "QDI"


  - platform: template
    name: "PI30 QFLAG"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "QFLAG"


  - platform: template
    name: "PI30 QMOD"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "QMOD"


  - platform: template
    name: "PI30 QPIGS"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "QPIGS"


  - platform: template
    name: "PI30 QPIWS"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "QPIWS"


  # -------------------------------------------------------------------
  # WRITE COMMANDS
  # -------------------------------------------------------------------

  # Output priority

  - platform: template
    name: "SET output: Utility first"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "POP00"


  - platform: template
    name: "SET output: Solar first"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "POP01"


  - platform: template
    name: "SET output: SBU"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "POP02"


  # -------------------------------------------------------------------
  # Charger priority
  # -------------------------------------------------------------------

  - platform: template
    name: "SET charger: Utility first"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "PCP00"


  - platform: template
    name: "SET charger: Solar first"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "PCP01"


  - platform: template
    name: "SET charger: Solar + Utility"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "PCP02"


  - platform: template
    name: "SET charger: Solar only"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "PCP03"


  # -------------------------------------------------------------------
  # Battery search
  # -------------------------------------------------------------------

  - platform: template
    name: "SET battery search: disabled"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "PSBS0"


  - platform: template
    name: "SET battery search: enabled"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "PSBS1"


  # -------------------------------------------------------------------
  # Standby
  # -------------------------------------------------------------------

  - platform: template
    name: "STANDBY (machine off)"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "PSDM"


  # -------------------------------------------------------------------
  # Output source priority status
  # -------------------------------------------------------------------

  - platform: template
    name: "READ output priority status"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "QOPS"


  # -------------------------------------------------------------------
  # Reset
  # -------------------------------------------------------------------

  - platform: template
    name: "RESET to factory defaults"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "RESET"


  # -------------------------------------------------------------------
  # Battery discharge
  # -------------------------------------------------------------------

  - platform: template
    name: "PI30 Battery discharge ON"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "PBATCD110"


  - platform: template
    name: "PI30 Battery discharge OFF"

    on_press:
      - script.execute:
          id: send_cmd
          cmd: "PBATCD010"


  # -------------------------------------------------------------------
  # Output settings
  # -------------------------------------------------------------------

  - platform: template
    name: "SET output voltage"

    on_press:
      - script.execute:
          id: send_param_cmd
          prefix: "POUTV"
          value: !lambda "return id(txt_poutv).state;"


  - platform: template
    name: "SET output frequency"

    on_press:
      - script.execute:
          id: send_param_cmd
          prefix: "POUTF"
          value: !lambda "return id(txt_poutf).state;"


  # -------------------------------------------------------------------
  # Battery voltage settings
  # -------------------------------------------------------------------

  - platform: template
    name: "SET battery bulk charge voltage"

    on_press:
      - script.execute:
          id: send_param_cmd
          prefix: "PBCV"
          value: !lambda "return id(txt_pbcv).state;"


  - platform: template
    name: "SET battery float voltage"

    on_press:
      - script.execute:
          id: send_param_cmd
          prefix: "PBFTV"
          value: !lambda "return id(txt_pbftv).state;"


  - platform: template
    name: "SET battery discharge voltage"

    on_press:
      - script.execute:
          id: send_param_cmd
          prefix: "PBDV"
          value: !lambda "return id(txt_pbdv).state;"


  - platform: template
    name: "SET battery low warning voltage"

    on_press:
      - script.execute:
          id: send_param_cmd
          prefix: "PBLWV"
          value: !lambda "return id(txt_pblwv).state;"


  # -------------------------------------------------------------------
  # Charging current
  # -------------------------------------------------------------------

  - platform: template
    name: "SET max charging current"

    on_press:
      - script.execute:
          id: send_param_cmd
          prefix: "MCHGC"
          value: !lambda "return id(txt_mchgc).state;"


  - platform: template
    name: "SET solar bulk charging current"

    on_press:
      - script.execute:
          id: send_param_cmd
          prefix: "PSBIC"
          value: !lambda "return id(txt_psbic).state;"


  # -------------------------------------------------------------------
  # Solar settings
  # -------------------------------------------------------------------

  - platform: template
    name: "SET solar charger over voltage"

    on_press:
      - script.execute:
