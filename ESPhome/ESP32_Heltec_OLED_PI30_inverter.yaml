# =====================================================================
# HELTEC INVERTER PI30 - read and control
# Heltec WiFi Kit 32 V3
#
# Display:
#   PAGE 1 = schermata principale
#   PAGE 2 = WiFi
#   PAGE 3 = Batteria / inverter
#   PAGE 4 = Carica / scarica batteria
#   PAGE 5 = Parametri batteria
#   PAGE 6 = Grafico tensione batteria
#
# GPIO inverter:
#   GPIO5 = TX
#   GPIO3 = RX
#
# MAX3232:
#   ESP GPIO5 (TX) -> MAX3232 "Node RX"
#   ESP GPIO3 (RX) <- MAX3232 "Node Tx"
#   3V3 -> "Node 3.3V"
#   GND -> "Node Gnd"
#
# RJ45 inverter:
#   pin 1 = TX
#   pin 2 = RX
#   pin 8 = GND
#   pin 4 = +12V -> NON COLLEGARE
# =====================================================================


esphome:
  name: "heltec-inverter"
  friendly_name: Heltec PI30 Display


esp32:
  board: heltec_wifi_kit_32_V3
  variant: esp32s3
  framework:
    type: arduino


logger:
  level: DEBUG
  baud_rate: 0


api:
  encryption:
    key: !secret api_key_heltec_v3
  reboot_timeout: 0s


ota:
  - platform: esphome


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  manual_ip:
    static_ip: 192.168.1.125
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 192.168.1.1

  power_save_mode: none

  ap:
    ssid: "Heltec-PI30"
    password: !secret wifi_hotspot_password


captive_portal:


# =====================================================================
# UART INVERTER
# =====================================================================

uart:

  - id: uart_0

    tx_pin: GPIO5
    rx_pin: GPIO3

    baud_rate: 2400
    data_bits: 8
    parity: NONE
    stop_bits: 1


# =====================================================================
# GLOBAL
# =====================================================================

globals:

  - id: g_polling
    type: bool
    restore_value: no
    initial_value: "false"


# =====================================================================
# SCRIPT - INVIO COMANDI PI30
# =====================================================================

script:

  # -------------------------------------------------------------------
  # Send a PI30 command
  # CRC-16/XMODEM computed at runtime
  # -------------------------------------------------------------------

  - id: send_cmd
    mode: queued
    max_runs: 20

    parameters:
      cmd: string

    then:

      - lambda: |-
          uint8_t c;

          while (id(uart_0).available())
            id(uart_0).read_byte(&c);


          std::vector<uint8_t> f(cmd.begin(), cmd.end());


          // CRC-16/XMODEM
          uint16_t crc = 0;

          for (auto b : f) {

            crc ^= (uint16_t) b << 8;

            for (int i = 0; i < 8; i++)
              crc = (crc & 0x8000)
                ? ((crc << 1) ^ 0x1021)
                : (crc << 1);
          }


          uint8_t hi = crc >> 8;
          uint8_t lo = crc & 0xFF;


          // PI30 rule:
          // 0x28 / 0x0D / 0x0A must be incremented

          if (hi == 0x28 || hi == 0x0D || hi == 0x0A)
            hi++;

          if (lo == 0x28 || lo == 0x0D || lo == 0x0A)
            lo++;


          f.push_back(hi);
          f.push_back(lo);
          f.push_back(0x0D);


          id(uart_0).write_array(f.data(), f.size());
          id(uart_0).flush();


          std::string hex;
          char b[8];

          for (auto x : f) {

            sprintf(b, "%02X ", x);
            hex += b;
          }


          ESP_LOGI(
            "PI30",
            "TX  \"%s\"  ->  %s",
            cmd.c_str(),
            hex.c_str()
          );


      - delay: 1500ms


      - lambda: |-
          std::vector<uint8_t> d;
          uint8_t c;


          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }


          if (d.empty()) {

            ESP_LOGW("PI30", "RX  no reply");
            return;
          }


          std::string hex;
          std::string txt;
          char b[8];


          for (auto x : d) {

            sprintf(b, "%02X ", x);
            hex += b;

            txt += (x >= 0x20 && x <= 0x7E)
              ? (char) x
              : '.';
          }


          ESP_LOGI(
            "PI30",
            "RX  %d bytes",
            (int) d.size()
          );

          ESP_LOGI(
            "PI30",
            "RX HEX    %s",
            hex.c_str()
          );

          ESP_LOGI(
            "PI30",
            "RX ASCII  %s",
            txt.c_str()
          );


          // Clean text:
          // CRC and CR stripped

          std::string t;

          for (auto x : d) {

            if (x == 0x0D)
              break;

            if (x >= 0x20 && x <= 0x7E)
              t += (char) x;
          }


          id(ts_reply).publish_state(t);


          if (t.rfind("(NAK", 0) == 0) {

            ESP_LOGW(
              "PI30",
              ">>> NAK: command rejected, but baud rate and wiring are OK."
            );

            return;
          }


          // ------------------------------------------------------------
          // QPIGS parsing
          // ------------------------------------------------------------

          if (
            cmd == "QPIGS" &&
            t.size() >= 20 &&
            t[0] == '('
          ) {

            std::vector<float> v;
            std::string tok;


            for (size_t i = 1; i <= t.size(); i++) {

              if (
                i == t.size() ||
                t[i] == ' '
              ) {

                if (!tok.empty()) {

                  v.push_back(
                    atof(tok.c_str())
                  );

                  tok.clear();
                }

              } else {

                tok += t[i];
              }
            }


            ESP_LOGI(
              "PI30",
              "QPIGS: %d fields",
              (int) v.size()
            );


            if (v.size() >= 17) {

              id(s_grid_v).publish_state(v[0]);
              id(s_grid_hz).publish_state(v[1]);

              id(s_out_v).publish_state(v[2]);
              id(s_out_hz).publish_state(v[3]);

              id(s_out_va).publish_state(v[4]);
              id(s_out_w).publish_state(v[5]);

              id(s_load).publish_state(v[6]);

              id(s_bus_v).publish_state(v[7]);
              id(s_batt_v).publish_state(v[8]);

              id(s_batt_chg).publish_state(v[9]);

              id(s_soc).publish_state(v[10]);
              id(s_temp).publish_state(v[11]);

              id(s_pv_a).publish_state(v[12]);
              id(s_pv_v).publish_state(v[13]);

              id(s_batt_dis).publish_state(v[15]);


              if (v.size() >= 20)
                id(s_pv_w).publish_state(v[19]);


              // Battery current:
              // charge current - discharge current

              float a = v[9] - v[15];

              id(s_batt_a).publish_state(a);


              // Battery power

              id(s_batt_w).publish_state(
                a * v[8]
              );


              ESP_LOGI(
                "PI30",
                "Grid %.1fV/%.1fHz | Out %.1fV %.0fW %.0f%% | Batt %.2fV %.1fA %.0f%%",
                v[0],
                v[1],
                v[2],
                v[5],
                v[6],
                v[8],
                a,
                v[10]
              );
            }

            return;
          }


  # ===================================================================
  # POLLING INVERTER
  # ===================================================================

  - id: poll_inverter
    mode: single

    then:

      - script.execute:
          id: send_cmd
          cmd: "QPIGS"

      - script.wait: send_cmd

      - script.execute:
          id: send_cmd
          cmd: "QMOD"

      - script.wait: send_cmd


  # ===================================================================
  # PARAMETRIC COMMANDS
  # ===================================================================

  - id: send_param_cmd
    mode: queued
    max_runs: 20

    parameters:
      prefix: string
      value: string

    then:

      - lambda: |-
          uint8_t c;

          while (id(uart_0).available())
            id(uart_0).read_byte(&c);


          char buf[64];


          // Build command:
          // prefix + value

          sprintf(
            buf,
            "%s%s",
            prefix.c_str(),
            value.c_str()
          );


          std::vector<uint8_t> f(
            buf,
            buf + strlen(buf)
          );


          // CRC-16/XMODEM

          uint16_t crc = 0;

          for (auto b : f) {

            crc ^= (uint16_t) b << 8;

            for (int i = 0; i < 8; i++)
              crc = (crc & 0x8000)
                ? ((crc << 1) ^ 0x1021)
                : (crc << 1);
          }


          uint8_t hi = crc >> 8;
          uint8_t lo = crc & 0xFF;


          if (hi == 0x28 || hi == 0x0D || hi == 0x0A)
            hi++;

          if (lo == 0x28 || lo == 0x0D || lo == 0x0A)
            lo++;


          f.push_back(hi);
          f.push_back(lo);
          f.push_back(0x0D);


          id(uart_0).write_array(
            f.data(),
            f.size()
          );

          id(uart_0).flush();


          std::string hex;
          char b[8];


          for (auto x : f) {

            sprintf(
              b,
              "%02X ",
              x
            );

            hex += b;
          }


          ESP_LOGI(
            "PI30",
            "TX  \"%s\"  ->  %s",
            buf,
            hex.c_str()
          );


      - delay: 1500ms


      - lambda: |-
          std::vector<uint8_t> d;
          uint8_t c;


          while (id(uart_0).available()) {

            if (id(uart_0).read_byte(&c))
              d.push_back(c);
          }


          if (d.empty()) {

            ESP_LOGW(
              "PI30",
              "RX  no reply"
            );

            return;
          }


          std::string hex;
          std::string txt;
          char b[8];


          for (auto x : d) {

            sprintf(
              b,
              "%02X ",
              x
            );

            hex += b;


            txt += (x >= 0x20 && x <= 0x7E)
              ? (char) x
              : '.';
          }


          ESP_LOGI(
            "PI30",
            "RX  %d bytes",
            (int) d.size()
          );

          ESP_LOGI(
            "PI30",
            "RX HEX    %s",
            hex.c_str()
          );

          ESP_LOGI(
            "PI30",
            "RX ASCII  %s",
            txt.c_str()
          );


          std::string t;


          for (auto x : d) {

            if (x == 0x0D)
              break;

            if (x >= 0x20 && x <= 0x7E)
              t += (char) x;
          }


          id(ts_reply).publish_state(t);


          if (t.rfind("(OK", 0) == 0) {

            ESP_LOGI(
              "PI30",
              ">>> Command accepted"
            );

          } else if (t.rfind("(NAK", 0) == 0) {

            ESP_LOGW(
              "PI30",
              ">>> Command rejected: value out of range or unsupported"
            );
          }


# =====================================================================
# SELECT
# =====================================================================

select:

  - platform: template

    name: "PI30 baud rate"

    initial_option: "2400"

    options:
      - "1200"
      - "2400"
      - "4800"
      - "9600"
      - "19200"
      - "38400"

    set_action:

      - lambda: |-
          int b = atoi(x.c_str());

          id(uart_0).set_baud_rate(b);
          id(uart_0).load_settings(false);

          ESP_LOGI(
            "PI30",
            "===== BAUD RATE now %d =====",
            b
          );


# =====================================================================
# TEXT INPUT
# =====================================================================

