# =====================================================================
# INTERVAL - POLLING + DISPLAY ROTATION
# TUTTI GLI INTERVAL SONO IN UN'UNICA SEZIONE
# =====================================================================

interval:

  # -------------------------------------------------------------------
  # PI30 polling
  # -------------------------------------------------------------------

  - interval: 15s

    then:

      - if:

          condition:
            lambda: |-
              return id(g_polling);

          then:
            - script.execute: poll_inverter


  # -------------------------------------------------------------------
  # Display page rotation
  # -------------------------------------------------------------------

  - interval: 4s

    then:

      - display.page.show_next: my_display
      - component.update: my_display


# =====================================================================
# TIME
# =====================================================================

time:

  - platform: homeassistant
    id: homeassistant_time


  - platform: sntp
    id: sntp_zone_time
    timezone: Europe/Rome


# =====================================================================
# I2C DISPLAY
# =====================================================================

i2c:

  - id: bus_a
    sda: GPIO17
    scl: GPIO18
    scan: false


# =====================================================================
# IMAGE
# =====================================================================

image:

  - platform: file
    file: solar_power.bmp
    id: solar_icon
    resize: 65x50
    type: BINARY


# =====================================================================
# GRAPH
# TENSIONE BATTERIA
#
# 23 V = minimo
# 29 V = massimo
# =====================================================================

graph:

  - id: battery_voltage_graph

    duration: 24h

    x_grid: 120min
    y_grid: 1

    width: 128
    height: 64

    min_value: 23
    max_value: 29

    traces:

      - sensor: s_batt_v
        line_type: SOLID
        line_thickness: 2


# =====================================================================
# OLED DISPLAY
# =====================================================================

display:

  - platform: ssd1306_i2c

    model: "SSD1306 128x64"

    reset_pin: GPIO21

    i2c_id: bus_a

    address: 0x3C

    contrast: 50%

    id: my_display


    pages:


      # ================================================================
      # PAGE 1
      # SCHERMATA PRINCIPALE
      # ================================================================

      - id: page1

        lambda: |-

          // ----------------------------------------------------------
          // Giorno della settimana in italiano
          // ----------------------------------------------------------

          auto now = id(homeassistant_time).now();

          const char *giorno;

          switch (now.day_of_week) {

            case 1:
              giorno = "Domenica";
              break;

            case 2:
              giorno = "Lunedì";
              break;

            case 3:
              giorno = "Martedì";
              break;

            case 4:
              giorno = "Mercoledì";
              break;

            case 5:
              giorno = "Giovedì";
              break;

            case 6:
              giorno = "Venerdì";
              break;

            case 7:
              giorno = "Sabato";
              break;

            default:
              giorno = "---";
              break;
          }


          // ----------------------------------------------------------
          // Mese in italiano
          // ----------------------------------------------------------

          const char *mese;

          switch (now.month) {

            case 1:
              mese = "Gen";
              break;

            case 2:
              mese = "Feb";
              break;

            case 3:
              mese = "Mar";
              break;

            case 4:
              mese = "Apr";
              break;

            case 5:
              mese = "Mag";
              break;

            case 6:
              mese = "Giu";
              break;

            case 7:
              mese = "Lug";
              break;

            case 8:
              mese = "Ago";
              break;

            case 9:
              mese = "Set";
              break;

            case 10:
              mese = "Ott";
              break;

            case 11:
              mese = "Nov";
              break;

            case 12:
              mese = "Dic";
              break;

            default:
              mese = "---";
              break;
          }


          // ----------------------------------------------------------
          // Icone disabilitate
          // ----------------------------------------------------------

          // it.printf(
          //   0,
          //   0,
          //   id(icon_font),
          //   TextAlign::TOP_LEFT,
          //   "󰟑󰌪"
          // );


          // ----------------------------------------------------------
          // Titolo
          // ----------------------------------------------------------

          it.printf(
            0,
            0,
            id(arial),
            TextAlign::TOP_LEFT,
            "Travis90x"
          );


          // ----------------------------------------------------------
          // Immagine solare
          // ----------------------------------------------------------

          it.image(
            10,
            16,
            id(solar_icon)
          );


          // ----------------------------------------------------------
          // Giorno
          // ----------------------------------------------------------

          it.printf(
            it.get_width(),
            it.get_height() - 48,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%s",
            giorno
          );


          // ----------------------------------------------------------
          // Data
          // ----------------------------------------------------------

          it.strftime(
            it.get_width(),
            it.get_height() - 36,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%d",
            now
          );


          // ----------------------------------------------------------
          // Mese
          // ----------------------------------------------------------

          it.printf(
            it.get_width(),
            it.get_height() - 24,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%s",
            mese
          );


          // ----------------------------------------------------------
          // Anno
          // ----------------------------------------------------------

          it.strftime(
            it.get_width(),
            it.get_height() - 12,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%Y",
            now
          );


          // ----------------------------------------------------------
          // Ora
          // ----------------------------------------------------------

          it.strftime(
            it.get_width(),
            it.get_height(),
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%H:%M",
            now
          );
      # ================================================================
      # PAGE 2
      # WIFI
      # ================================================================

      - id: page2

        lambda: |-

          // ----------------------------------------------------------
          // Icona WiFi + SSID
          // ----------------------------------------------------------

          it.printf(
            0,
            0,
            id(icon_font),
            TextAlign::TOP_LEFT,
            "󰖩"
          );


          it.printf(
            20,
            0,
            id(arial),
            TextAlign::TOP_LEFT,
            "SSID:"
          );


          it.printf(
            it.get_width(),
            0,
            id(arial),
            TextAlign::TOP_RIGHT,
            "%s",
            id(wifi_ssid).state.c_str()
          );


          // ----------------------------------------------------------
          // IP
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 37,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "IP"
          );


          it.printf(
            it.get_width(),
            it.get_height() - 37,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%s",
            id(ip_address).state.c_str()
          );


          // ----------------------------------------------------------
          // WiFi Signal %
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 25,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "WiFi Signal"
          );


          it.printf(
            it.get_width(),
            it.get_height() - 25,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%.0f%%",
            id(wifi_signal_percentage).state
          );


          // ----------------------------------------------------------
          // WiFi Signal dBm
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 13,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "WiFi"
          );


          it.printf(
            it.get_width(),
            it.get_height() - 13,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%.0f dBm",
            id(wifi_signal_db).state
          );

      # ================================================================
      # PAGE 3
      # BATTERIA
      # ================================================================

      - id: page3

        lambda: |-

          it.printf(
            0,
            0,
            id(icon_font),
            TextAlign::TOP_LEFT,
            "󱊣"
          );


          it.printf(
            it.get_width() / 2,
            0,
            id(arial),
            TextAlign::TOP_CENTER,
            "BATTERIA"
          );


          // ----------------------------------------------------------
          // Tensione
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 37,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "Tensione"
          );


          it.printf(
            it.get_width(),
            it.get_height() - 37,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%.2f V",
            id(display_battery_voltage).state
          );


          // ----------------------------------------------------------
          // SOC
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 25,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "SOC"
          );


          it.printf(
            it.get_width(),
            it.get_height() - 25,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%.0f%%",
            id(display_battery_soc).state
          );


          // ----------------------------------------------------------
          // Temperatura
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 13,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "Temp."
          );


          it.printf(
            it.get_width(),
            it.get_height() - 13,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%.0f°C",
            id(display_heat_sink_temperature).state
          );


          // ----------------------------------------------------------
          // Power
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 1,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "Power"
          );


          it.printf(
            it.get_width(),
            it.get_height() - 1,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%.0f W",
            id(display_output_active_power).state
          );
      # ================================================================
      # PAGE 4
      # CARICA / SCARICA
      # ================================================================

      - id: page4

        lambda: |-

          it.printf(
            0,
            0,
            id(icon_font),
            TextAlign::TOP_LEFT,
            "󱊥"
          );


          it.printf(
            it.get_width() / 2,
            0,
            id(arial),
            TextAlign::TOP_CENTER,
            "BATTERIA"
          );


          // ----------------------------------------------------------
          // Carica
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 37,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "Carica"
          );

          it.printf(
            it.get_width(),
            it.get_height() - 37,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%.0f W",
            id(display_battery_charge_power).state
          );


          // ----------------------------------------------------------
          // Energia caricata
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 25,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "Caricata"
          );

          it.printf(
            it.get_width(),
            it.get_height() - 25,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%.2f kWh",
            id(display_battery_charge_energy).state
          );


          // ----------------------------------------------------------
          // Scarica
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 13,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "Scarica"
          );

          it.printf(
            it.get_width(),
            it.get_height() - 13,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%.0f W",
            id(display_battery_discharge_power).state
          );


          // ----------------------------------------------------------
          // Energia scaricata
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 1,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "Scaricata"
          );

          it.printf(
            it.get_width(),
            it.get_height() - 1,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%.2f kWh",
            id(display_battery_discharge_energy).state
          );

      # ================================================================
      # PAGE 5
      # PARAMETRI BATTERIA
      # ================================================================

      - id: page5

        lambda: |-

          it.printf(
            0,
            0,
            id(icon_font),
            TextAlign::TOP_LEFT,
            "󱊦"
          );


          it.printf(
            it.get_width() / 2,
            0,
            id(arial),
            TextAlign::TOP_CENTER,
            "SETTAGGI"
          );


          // ----------------------------------------------------------
          // Bulk
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 37,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "Bulk"
          );

          it.printf(
            it.get_width(),
            it.get_height() - 37,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%s V",
            id(display_bulk_voltage).state.c_str()
          );


          // ----------------------------------------------------------
          // Float
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 25,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "Float"
          );

          it.printf(
            it.get_width(),
            it.get_height() - 25,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%s V",
            id(display_float_voltage).state.c_str()
          );


          // ----------------------------------------------------------
          // Low
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 13,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "Low"
          );

          it.printf(
            it.get_width(),
            it.get_height() - 13,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%s V",
            id(display_discharge_voltage).state.c_str()
          );


          // ----------------------------------------------------------
          // Alert
          // ----------------------------------------------------------

          it.printf(
            0,
            it.get_height() - 1,
            id(arial),
            TextAlign::BASELINE_LEFT,
            "Alert"
          );

          it.printf(
            it.get_width(),
            it.get_height() - 1,
            id(arial),
            TextAlign::BASELINE_RIGHT,
            "%s V",
            id(display_low_warning_voltage).state.c_str()
          );

      # ================================================================
      # PAGE 6
      # GRAFICO TENSIONE BATTERIA
      #
      # Sensore:
      # sensor.heltec_pi30_pi30_battery_voltage
      #
      # Range:
      # 23 - 29 V
      # ================================================================

      - id: page6

        lambda: |-

          it.graph(
            0,
            0,
            id(battery_voltage_graph)
          );


