    update_interval: 10s

    entity_category: diagnostic


  # -------------------------------------------------------------------
  # WiFi signal percentage
  # -------------------------------------------------------------------

  - platform: copy

    source_id: wifi_signal_db

    id: wifi_signal_percentage

    name: "WiFi Signal %"

    filters:

      - lambda: |-
          return min(
            max(
              2 * (x + 100.0),
              0.0
            ),
            100.0
          );

    unit_of_measurement: "Signal %"

    entity_category: diagnostic


